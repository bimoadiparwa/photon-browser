[package]
name = "photon-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "photon"
path = "src/main.rs"

[dependencies]
photon-core = { path = "../crates/photon-core" }
photon-app = { path = "../crates/photon-app" }
photon-store = { path = "../crates/photon-store" }
photon-blocker = { path = "../crates/photon-blocker" }
photon-engine = { path = "../crates/photon-engine" }
wry = { version = "=0.55.1", features = ["os-webview"], optional = true }
tao = { version = "0.35", optional = true }
gtk = { version = "0.18", optional = true }

[features]
default = []
native-ui = ["dep:wry", "dep:tao", "dep:gtk"]
